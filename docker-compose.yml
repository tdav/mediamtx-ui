networks:
  camnet:
    driver: bridge

services:

  mediamtx:
    image: bluenviron/mediamtx:${MEDIAMTX_VERSION}
    container_name: mediamtx
    restart: unless-stopped
    ports:
      - "${HLS_PORT}:${HLS_PORT}"                   # HLS
      - "${RTSP_PORT}:${RTSP_PORT}"                 # RTSP
      - "${RTMP_PORT}:${RTMP_PORT}"                 # RTMP
      - "${WEBRTC_PORT}:${WEBRTC_PORT}"             # WebRTC API
      - "${WEBRTC_UDP_PORT}:${WEBRTC_UDP_PORT}/udp" # WebRTC ICE/UDP
      - "${METRICS_PORT}:${METRICS_PORT}"           # Metrics
#      - "${API_PORT}:${API_PORT}"                   # API (reachable per docker network)
    volumes:
      - ./config/mediamtx.yml:/mediamtx.yml:ro
      - ./media:/media
    networks:
      - camnet
    # devices: (disabled - no camera devices on Windows)

  mediamtxui:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${PROJECT_NAME}
    container_name: ${PROJECT_NAME}
    working_dir: /app/server
    restart: always
    command: 'tail -f /dev/null'
    #command: 'node index.js'
    user: root
    networks:
      - camnet
    ports:
      - "${SERVER_PORT}:${SERVER_PORT}"
      - "35729:35729"
    volumes:
      - /app/node_modules
      - .:/app
#      - /usr/bin/ffmpeg:/usr/local/bin/ffmpeg:ro
#      - /usr/bin/ffprobe:/usr/local/bin/ffprobe:ro
#     - /usr/lib/:/usr/lib/:ro
#     - /etc/alternatives:/etc/alternatives/:ro
    environment:
      - DEBUG=true
      - VERBOSE=2
      - ENVIRONMENT=default
      - NODE_ENV=development
      - SERVER_PORT=${SERVER_PORT}
      - RTSP_PORT=${RTSP_PORT}
      - HLS_PORT=${HLS_PORT}
      - WEBRTC_PORT=${WEBRTC_PORT}
      - WEBRTC_UDP_PORT=${WEBRTC_UDP_PORT}
      - API_PORT=${API_PORT}
      - MEDIAMTX_API_URL_BASE=http://mediamtx:9997/v3
      - MEDIAMTX_METRICS_URL_BASE=http://mediamtx:9996/metrics
    # devices: (disabled - no camera devices on Windows)
    #   - '/dev/video0:/dev/video0'

  browser:
    build:
      context: ./browser
      dockerfile: Dockerfile
    container_name: browser
    command: ["/app/start.sh"]
    shm_size: 1g
    restart: unless-stopped
    volumes:
      - ./browser/start.sh:/app/start.sh:ro
    environment:
      DISPLAY: ":99"
    networks:
      - camnet
    devices:
      - '/dev/video10:/dev/video10'
      - '/dev/video11:/dev/video11'
